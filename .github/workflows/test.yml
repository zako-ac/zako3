name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-path:
    # The audio path crates: the stall instrumentation and the transport that
    # emits it. These are the tests that prove a stall report names the right
    # hop, so they run on every pull request.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      - name: Format check
        run: cargo fmt -p zako3-audio-probe -p zako3-taphub-transport-client -- --check

      - name: Test
        run: cargo test -p zako3-audio-probe -p zako3-taphub-transport-client -p zako3-taphub-transport-lib -p zako3-opus-jitter

      - name: Clippy
        run: |
          cargo clippy -p zako3-audio-probe -p zako3-taphub-transport-client \
            -p zako3-taphub-transport-lib -p zako3-opus-jitter \
            --all-targets --no-deps -- -D warnings

  touched-services:
    # The services the instrumentation writes from: taphub publishes the hop
    # record, the engine reads it. Checked, not tested, because their tests need
    # a cluster.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      # Compile check, not a warning gate: these services have lints that
      # predate this pipeline (an unused import in handler/cancel.rs, a
      # redundant pattern in preload.rs, ZakoError's size in hq_client.rs) and
      # fixing them belongs to its own change, not to whatever branch happens
      # to touch the crate next.
      - name: Clippy
        run: |
          cargo clippy -p zako3-taphub-core -p zako3-audio-engine-infra \
            -p zako3-audio-engine-controller -p zako3-telemetry \
            --all-targets --no-deps

  tap-drain:
    # The scale-down path. A tap pod being deleted has to leave taphub's routing
    # table at once and take its in-flight requests with it, instead of being
    # routed into until the QUIC connection gives up. The tests for it live in
    # two places: `zakofish-taphub` drives a real connection through a drain, and
    # `zako3-taphub-core` asserts a draining connection is out of the routing set.
    # Nothing ran them. `touched-services` compiles `zako3-taphub-core` and its
    # unit tests and stops there, and `zakofish-taphub`'s test target is not built
    # by any lane at all, so a regression in either would have merged green.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      - name: taphub-core unit tests (draining connections among them)
        run: cargo test -p zako3-taphub-core --lib

      - name: the drain notice over a real connection (pf3_drain)
        run: cargo test -p zakofish-taphub --test pf3_drain

  engine-core:
    # The audio engine's own tests: the no-consumer refusal, the track watchdog
    # and the queue age cap all live in this target. Nothing compiled it, which
    # is how main came to carry a test target that did not build — the stall
    # instrumentation called `create_session_control` with the arity it had
    # before the no-consumer change, and every check stayed green because no
    # lane built these tests.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      - name: Format check
        run: cargo fmt -p zako3-audio-engine-core -- --check

      - name: Test
        run: cargo test -p zako3-audio-engine-core --lib

      # Compile check, not a warning gate, for the same reason as the job above:
      # the engine predates the pipeline and carries lints of its own (the size
      # of `ZakoError` in `session.rs`, and one unused import in the songbird
      # fork). Fixing those belongs to its own change.
      - name: Clippy
        run: cargo clippy -p zako3-audio-engine-core --all-targets --no-deps

  tap-self-heal:
    # The recovery path: taphub closing a connection that stopped answering, and
    # the tap coming back without its process being touched. Same lesson as the
    # `tap-drain` lane above — these tests existed and nothing ran them, so a
    # regression in the recovery loop would have merged green.
    #
    # `zako3-taphub-core --lib` also runs in `tap-drain`; it is repeated here on
    # purpose so this lane fails on its own subject rather than borrowing another
    # job's step name.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      - name: the hub closes a wedged connection and the tap reconnects (pf3_self_heal)
        run: cargo test -p zakofish-taphub --test pf3_self_heal

      - name: the close rule, and the sweep that applies it
        run: cargo test -p zako3-taphub-core --lib

      - name: the tap's own request deadline (a child process exits 70)
        run: cargo test -p zako3-tap-sdk --lib

  proxy-hq:
    # The two pieces of the "a message was typed and nobody heard it" path that
    # no lane built before this one: `ae-proxy` relays every audio datagram on
    # the v4 path and `hq` decides whether a message becomes audio at all. A
    # change to either could previously only fail in the image build, long after
    # review.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-rust

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config libssl-dev nasm

      - name: the relay holds, sheds and gives up on a route lookup (ae-proxy)
        run: cargo test -p zako3-ae-proxy

      - name: drop and unreadable accounting (hq-core)
        run: cargo test -p hq-core --lib

      # Compile check, not a warning gate: `hq-bot` carries lints that predate
      # this pipeline, and the point of the step is that the crate is built on a
      # pull request at all.
      - name: Clippy (compile check for the message path)
        run: cargo clippy -p zako3-ae-proxy -p hq-core -p hq-bot --all-targets --no-deps
