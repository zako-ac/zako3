{{- $fullname := include "zako3.fullname" . }}
{{- $instanceSecretName := printf "%s-audio-engine-secret" $fullname }}
{{- $existingSecret := .Values.audioEngine.existingSecret.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-audio-engine
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: audio-engine
    zako.ac/service: ae
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: audio-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-audio-engine
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: audio-engine
    zako.ac/service: ae
spec:
  serviceName: {{ $fullname }}-audio-engine
  replicas: {{ .Values.audioEngine.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: audio-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audio-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
        zako.ac/service: ae
    spec:
      {{- include "zako3.nodeAffinity" (dict "global" .Values.nodeAffinity "local" .Values.audioEngine.nodeAffinity) | nindent 6 }}
      containers:
        - name: audio-engine
          image: {{ include "zako3.imageRef" (dict "registry" .Values.image.registry "name" "audio-engine" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
            - name: metrics
              containerPort: 9090
            {{- if .Values.aeProxy.publicAddr }}
            - name: udp-ingest
              protocol: UDP
              containerPort: {{ .Values.ports.aeUdpIngest }}
            {{- end }}
          env:
            - name: REDIS_URL
              value: "redis://{{ $fullname }}-redis:6379"
            - name: AE_PORT
              value: "8090"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AE_ADVERTISE_ADDR
              value: "http://$(POD_NAME).{{ $fullname }}-audio-engine.$(POD_NAMESPACE).svc.cluster.local:8090"
            - name: TL_RPC_URL
              value: "http://{{ $fullname }}-traffic-light:{{ .Values.ports.tlRpc }}"
            - name: TAPHUB_URL
              value: "{{ $fullname }}-taphub:{{ .Values.ports.taphubTransport }}"
            - name: TAPHUB_SNI
              value: "{{ $fullname }}-taphub"
            - name: TAPHUB_TRANSPORT_CERT_FILE
              value: "/certs/transport/{{ .Values.taphub.transportTlsCaFilename }}"
            - name: TAPHUB_REQUEST_TIMEOUT_MS
              value: "6000"
            # --- v4 audio plane ---
            # Present only when the proxy has a public address configured;
            # without it HQ has nowhere to point taps, so leaving these unset
            # keeps the engine on the taphub path.
            {{- if .Values.aeProxy.publicAddr }}
            - name: HQ_RPC_URL
              value: "http://{{ $fullname }}-hq:{{ .Values.ports.hqRpc }}"
            - name: HQ_RPC_ADMIN_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-hq-secret" $fullname)
                    "existingName" .Values.hq.existingSecret.name
                    "key" .Values.hq.existingSecret.keys.rpcAdminToken) | nindent 16 }}
            - name: UDP_BIND_ADDR
              value: "0.0.0.0:{{ .Values.ports.aeUdpIngest }}"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CACHE_RPC_URL
              value: "http://{{ $fullname }}-cache:{{ .Values.ports.cache }}"
            {{- if .Values.cache.adminTokenSecret.name }}
            - name: CACHE_RPC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cache.adminTokenSecret.name }}
                  key: {{ .Values.cache.adminTokenSecret.key }}
            {{- end }}
            {{- end }}
              value: {{ .Values.audioEngine.requestTimeoutMs | default "13000" | quote }}
            - name: OTLP_ENDPOINT
              value: {{ include "zako3.otlpEndpoint" . | quote }}
            {{- include "zako3.otlpAuthEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "9090"
            - name: DISCORD_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" $instanceSecretName
                    "existingName" $existingSecret
                    "key" .Values.audioEngine.existingSecret.discordTokenKey) | nindent 16 }}
            - name: AE_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" $instanceSecretName
                    "existingName" $existingSecret
                    "key" .Values.audioEngine.existingSecret.aeTokenKey) | nindent 16 }}
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: transport-tls-cert
              mountPath: /certs/transport
              readOnly: true
      volumes:
        - name: transport-tls-cert
          secret:
            secretName: {{ required "taphub.transportTlsSecret is required" .Values.taphub.transportTlsSecret }}
            items:
              - key: {{ .Values.taphub.transportTlsCaFilename }}
                path: {{ .Values.taphub.transportTlsCaFilename }}
