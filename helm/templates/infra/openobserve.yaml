{{- $fullname := include "zako3.fullname" . -}}
{{- $secretName := ternary (printf "%s-openobserve-secret" $fullname) .Values.openobserve.existingSecret.name (not .Values.openobserve.existingSecret.name) -}}
{{- $pvc := dict "root" . "persistence" .Values.openobserve.persistence "default" "openobserve-data" "size" (.Values.openobserve.storageSize | default "20Gi") "accessMode" "ReadWriteOnce" -}}
{{- include "zako3.pvc" $pvc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-otel-collector-config
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      otlphttp/clickstack:
        endpoint: "http://{{ $fullname }}-clickstack:4318"
        headers:
          authorization: "${env:CLICKSTACK_OTLP_TOKEN}"
        compression: gzip
        # The queue is half the reason every service exports here instead of to
        # ClickStack directly: a ClickStack restart, or a ClickHouse merge that
        # stalls ingest, costs a delay instead of the telemetry. 512 batches at
        # 5s is 5 to 10 minutes of cushion; max_elapsed_time bounds a longer
        # outage at 10 minutes per batch.
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 600s
        sending_queue:
          enabled: true
          queue_size: 512

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      # First in every pipeline: the queue is in memory, so without this the
      # exact scenario the queue exists for (ClickStack down for minutes) grows
      # the heap until the OOM killer takes the pod and the buffered telemetry
      # with it. Refusing new data under pressure loses less than dying.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      # ClickStack writes into ClickHouse, which dislikes one insert per span.
      batch:
        timeout: 5s
        send_batch_size: 1024

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/clickstack]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/clickstack]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/clickstack]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-openobserve
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: openobserve
spec:
  serviceName: {{ $fullname }}-openobserve
  replicas: {{ .Values.openobserve.replicas }}
  selector:
    matchLabels:
      {{- include "zako3.selectorLabels" (dict "component" "openobserve" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zako3.selectorLabels" (dict "component" "openobserve" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "zako3.nodeAffinity" (dict "global" .Values.nodeAffinity "local" .Values.openobserve.nodeAffinity) | nindent 6 }}
      containers:
        - name: openobserve
          image: {{ .Values.openobserve.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5080
          env:
            - name: ZO_DATA_DIR
              value: /data
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-openobserve-secret" $fullname)
                    "existingName" .Values.openobserve.existingSecret.name
                    "key" .Values.openobserve.existingSecret.emailKey) | nindent 16 }}
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-openobserve-secret" $fullname)
                    "existingName" .Values.openobserve.existingSecret.name
                    "key" .Values.openobserve.existingSecret.passwordKey) | nindent 16 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "zako3.pvcName" $pvc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-openobserve
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "zako3.selectorLabels" (dict "component" "openobserve" "Release" .Release) | nindent 4 }}
  ports:
    - name: http
      port: 5080
      targetPort: 5080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-otel-collector
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  # Every workload in the namespace now depends on this hop, so it is not a
  # single pod any more. The config is stateless; the queue lives in each pod.
  replicas: 2
  selector:
    matchLabels:
      {{- include "zako3.selectorLabels" (dict "component" "otel-collector" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zako3.selectorLabels" (dict "component" "otel-collector" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "zako3.nodeAffinity" (dict "global" .Values.nodeAffinity "local" .Values.openobserve.nodeAffinity) | nindent 6 }}
      containers:
        - name: otel-collector
          image: {{ .Values.openobserve.otelCollectorImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otel-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: CLICKSTACK_OTLP_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-clickstack-secret" $fullname)
                    "existingName" .Values.clickstack.existingSecret.name
                    "key" .Values.clickstack.existingSecret.otlpTokenKey) | nindent 16 }}
          # Every service plus the node log agent now funnel through this pod,
          # so it gets a floor and a ceiling instead of BestEffort. The ceiling
          # is paired with memory_limiter in the config: shed load before the
          # kernel takes the pod and the in-memory queue with it.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otel-config.yaml
              subPath: otel-config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-otel-collector-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-otel-collector
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "zako3.selectorLabels" (dict "component" "otel-collector" "Release" .Release) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-otel-collector
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "zako3.selectorLabels" (dict "component" "otel-collector" "Release" .Release) | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
