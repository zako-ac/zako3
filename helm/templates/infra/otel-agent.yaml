{{- if .Values.logAgent.enabled -}}
{{- $fullname := include "zako3.fullname" . -}}
{{/*
Node log shipper.

kubelet's container log rotation is the only thing that stores pod logs today
(containerLogMaxSize 10Mi x 5 files), so a pod that writes at the rate these do
keeps roughly eight hours and nothing can be asked about last night. This agent
tails /var/log/pods for this namespace, tags each record with its pod and
container, and sends it to the collector gateway, which writes it into
ClickStack's `otel_logs` (TTL 30 days). node/log rotation stops mattering for
anything that has already been read.

The retention knob is ClickHouse's, not this pod's: otel_logs carries
`TTL toDateTime(Timestamp) + toIntervalDay(30)`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-otel-agent-config
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
data:
  agent-config.yaml: |
    {{- include "zako3.otelAgentConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullname }}-otel-agent
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-agent
spec:
  selector:
    matchLabels:
      {{- include "zako3.selectorLabels" (dict "component" "otel-agent" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zako3.selectorLabels" (dict "component" "otel-agent" "Release" .Release) | nindent 8 }}
      annotations:
        # A ConfigMap edit alone leaves the running pods on the old config.
        checksum/config: {{ include "zako3.otelAgentConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # The image's default user cannot write the node state dir kubelet
      # creates for the offsets, and this pod's whole job is reading host files.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: otel-agent
          image: {{ .Values.logAgent.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otel-agent/agent-config.yaml"]
          env:
            - name: CLICKSTACK_OTLP_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-clickstack-secret" $fullname)
                    "existingName" .Values.clickstack.existingSecret.name
                    "key" .Values.clickstack.existingSecret.otlpTokenKey) | nindent 16 }}
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel-agent
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: storage
              mountPath: /var/lib/otel-agent
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-otel-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: storage
          hostPath:
            path: /var/lib/zako3-otel-agent
            type: DirectoryOrCreate
{{- end }}
