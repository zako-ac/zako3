{{- $fullname := include "zako3.fullname" . -}}
{{- $pvc := dict "root" . "persistence" .Values.clickstack.persistence "default" "clickstack-data" "size" (.Values.clickstack.storageSize | default "100Gi") "accessMode" "ReadWriteOnce" -}}
{{- include "zako3.pvc" $pvc }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-clickstack
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack
spec:
  serviceName: {{ $fullname }}-clickstack
  replicas: {{ .Values.clickstack.replicas }}
  selector:
    matchLabels:
      {{- include "zako3.selectorLabels" (dict "component" "clickstack" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zako3.selectorLabels" (dict "component" "clickstack" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "zako3.nodeAffinity" (dict "global" .Values.nodeAffinity "local" .Values.clickstack.nodeAffinity) | nindent 6 }}
      containers:
        - name: clickstack
          image: {{ .Values.clickstack.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ui
              containerPort: 8080
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: opamp
              containerPort: 4320
          env:
            {{- with .Values.clickstack.appUrl }}
            - name: HYPERDX_APP_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OTLP_AUTH_TOKEN
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-clickstack-secret" $fullname)
                    "existingName" .Values.clickstack.existingSecret.name
                    "key" .Values.clickstack.existingSecret.otlpTokenKey) | nindent 16 }}
            - name: HYPERDX_API_KEY
              valueFrom:
                {{- include "zako3.secretKeyRef" (dict
                    "secretName" (printf "%s-clickstack-secret" $fullname)
                    "existingName" .Values.clickstack.existingSecret.name
                    "key" .Values.clickstack.existingSecret.apiKeyKey) | nindent 16 }}
          # The all-in-one entrypoint sits in `Waiting for ClickHouse to be
          # ready...` forever if clickhouse-server dies, and the pod still
          # reports Ready because nothing probed it. That is how a full volume
          # on 2026-10-14 turned into six weeks of `Connection refused` with no
          # alert. Startup gets a wide window because the first boot runs the
          # ClickStack schema migration (minutes, not seconds); readiness gates
          # the Service so the gateway's exporter queues instead of erroring.
          #
          # No livenessProbe on purpose: a restart landing in the middle of a
          # schema migration or a large merge loses more than it recovers, and
          # the pod being unready is already enough for the gateway to hold
          # telemetry.
          startupProbe:
            tcpSocket:
              port: 4317
            # 30 x 60s = 30 minutes. A startup probe still restarts the
            # container when it expires, so the window has to be long enough to
            # cover a migration on a volume that is no longer empty; the coarse
            # period is deliberate, so a kill lands after a whole minute of no
            # listener rather than mid-flush.
            periodSeconds: 60
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 4317
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
              subPath: clickhouse
            - name: data
              mountPath: /var/log/clickhouse-server
              subPath: clickhouse-logs
            - name: data
              mountPath: /data/db
              subPath: mongo
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "zako3.pvcName" $pvc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-clickstack
  labels:
    {{- include "zako3.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "zako3.selectorLabels" (dict "component" "clickstack" "Release" .Release) | nindent 4 }}
  ports:
    - name: ui
      port: 8080
      targetPort: 8080
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: opamp
      port: 4320
      targetPort: 4320
