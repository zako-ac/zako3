image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

# Telemetry configuration
telemetry:
  otelFilter: "debug,h2=off,tonic=off,hyper=off,tower=off,quinn=off,jsonrpsee=off,serenity::gateway=off"

# Global nodeAffinity applied to all pods unless overridden per-service
nodeAffinity: {}

# Default storageClass for every PVC. Each service can override it under its own
# `persistence.storageClass`. Use "-" (at either level) to render an empty class,
# which binds only pre-provisioned volumes.
storageClass: ""

# Every service with a volume exposes the same `persistence` block:
#   name: ""            # PVC name override (default: <release>-<component>)
#   existingClaim: ""   # use a PVC managed outside the chart; none is created
#   storageClass: ""    # overrides the global storageClass ("-" = empty class)
#   size: "10Gi"
#   accessModes: []     # overrides the component default
#   annotations: {}
#   volumeName: ""      # bind to a specific PV

# --- Postgres ---
postgres:
  # false = do not deploy the bundled Postgres; point the services at an external
  # one via externalUrl below or via existingSecret.name + databaseUrlKey.
  enabled: true
  externalUrl: ""
  nodeAffinity: {}
  user: zako3
  password: ""
  db: zako3
  existingSecret:
    name: ""
    key: "password"
    databaseUrlKey: "database-url"
  persistence:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "10Gi"
    accessModes: []
    annotations: {}
    volumeName: ""

# --- TimescaleDB ---
timescale:
  # false = do not deploy the bundled TimescaleDB; see postgres.enabled above.
  enabled: true
  externalUrl: ""
  user: metrics
  password: ""
  db: metrics
  existingSecret:
    name: ""
    key: "password"
    databaseUrlKey: "database-url"
  persistence:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "20Gi"
    accessModes: []
    annotations: {}
    volumeName: ""

# --- HQ service ---
hq:
  nodeAffinity: {}
  discordRedirectUri: "http://localhost:8080/auth/callback"
  # Inline values — chart creates a Secret from these if existingSecret.name is not set
  rpcAdminToken: ""
  discordClientId: ""
  discordClientSecret: ""
  discordBotToken: ""
  jwtSecret: ""
  zakoWebsiteUrl: "https://zako.ac"
  # Reference an existing Secret instead (all keys must exist in the Secret)
  existingSecret:
    name: ""
    keys:
      rpcAdminToken: "rpc-admin-token"
      discordClientId: "discord-client-id"
      discordClientSecret: "discord-client-secret"
      discordBotToken: "discord-bot-token"
      jwtSecret: "jwt-secret"
  metricsPort: "9091"
  tokioConsolePort: "6669"
  subBotIds: ""                         # Comma-separated sub-bot client IDs
  botInvitePermissions: "4895026873161728"
  mapperCacheRefreshSecs: "300"         # Periodic mapper-cache safety refresh (seconds); 0 disables

# --- TapHub service ---
taphub:
  nodeAffinity: {}
  hqRpcAdminToken: ""
  existingSecret:
    name: ""
    key: "hq-rpc-admin-token"
  # TLS secrets for zakofish (public, LoadBalancer) and transport (internal, ClusterIP)
  # Both must reference existing Secrets; configure key names below
  zakofishTlsSecret: ""
  zakofishTlsCertFilename: "zakofish-cert.pem"
  zakofishTlsKeyFilename: "zakofish-key.pem"
  transportTlsSecret: ""
  transportTlsCertFilename: "transport-cert.pem"
  transportTlsKeyFilename: "transport-key.pem"
  transportTlsCaFilename: "ca-cert.pem"
  requestTimeoutMs: "13000"
  # TTL (seconds) for tap connection-state leases in Redis; refreshed by the hub
  # on a heartbeat (~ttl/3) so stale state from a crash expires within this window.
  connectionLeaseTtlSecs: "30"
  metricsPort: "9092"
  tokioConsolePort: "6669"
  # DEBUG ONLY: accept all tap auth and audio requests without HQ. Do NOT
  # enable in production.
  bypassHq: false
  # Annotations for the zakofish LoadBalancer Service (e.g. cloud-provider LB tuning)
  zakofishServiceAnnotations: {}

# --- Audio Engine ---
# Use existingSecret.name to reference a pre-existing Secret; otherwise inline values are used.
audioEngine:
  replicas: 1
  nodeAffinity: {}
  discordToken: ""
  aeToken: "changeme"
  existingSecret:
    name: ""
    discordTokenKey: "discord-token"
    aeTokenKey: "ae-token"

# --- Traffic Light ---
trafficLight:
  nodeAffinity: {}
  discordTokens: ""
  existingSecret:
    name: ""
    discordTokensKey: "discord-tokens"
  metricsPort: "9090"
  tokioConsolePort: "6669"

# --- Web frontend ---
web:
  viteApiBaseUrl: "/api/v1"
  viteWsBaseUrl: "ws://localhost"
  viteGrafanaUrl: "http://localhost:3000"

# --- Shared UDP proxy (temporary: routes tap audio while it owns the only
# public IP; removed once every sink has its own) ---
aeProxy:
  # Public address taps send audio to, as host:port. Leave empty to disable the
  # v4 audio path — HQ then has nowhere to point taps and answers Legacy.
  publicAddr: ""

# --- Cache server (cache + GC, taphub talks to it over HTTP) ---
cache:
  nodeAffinity: {}
  cacheDir: "/cache"
  gcIntervalSeconds: "1800"
  # Keep below `persistence.size` — the GDSF pass only evicts once the indexed
  # total exceeds this, so a budget larger than the volume lets the disk fill first.
  maxCacheBytes: "4294967296"
  # Sidecar reads in flight while the index warms up at startup.
  warmupConcurrency: "64"
  # How long a preload upload may sit idle before it is collected. A producer
  # that dies otherwise leaves an index entry pointing GET /stream at a dead
  # partial file for that cache key, for the life of the pod. 0 disables it.
  preloadSessionTtlSeconds: "300"
  # Optional shared admin token between cache server and taphub. Leave name empty to disable auth.
  adminTokenSecret:
    name: ""
    key: "cache-admin-token"
  # Cache PVC. Default name stays "<release>-taphub-cache" so existing volumes keep binding.
  persistence:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "5Gi"
    accessModes: []          # default: [ReadWriteMany]
    annotations: {}
    volumeName: ""

metricsSync:
  nodeAffinity: {}
  syncIntervalSeconds: 60

# --- Emoji matcher worker ---
emojiMatcher:
  nodeAffinity: {}
  httpPort: 9093
  workerConcurrency: 8
  matchHammingThreshold: 4

# --- Ports ---
ports:
  hqBackend: 8080
  hqRpc: 50052
  taphubTransport: 4000
  # zakofish (protofish3) tap listener port.
  taphubZakofish: 1028
  tlRpc: 7070
  tlAeTransport: 7071
  cache: 4100
  # UDP port each audio engine receives tap audio on. Cluster-internal while the
  # shared proxy fronts it; becomes the public port once engines get their own IPs.
  aeUdpIngest: 5000
  web: 80

# --- Redis ---
redis:
  image: redis:7-alpine

# --- NATS ---
nats:
  image: nats:2-alpine

# --- OpenObserve (disabled — kept for reference, scaled to 0) ---
openobserve:
  replicas: 0
  nodeAffinity: {}
  image: public.ecr.aws/zinclabs/openobserve:latest
  otelCollectorImage: otel/opentelemetry-collector-contrib:latest
  rootUserEmail: "admin@example.com"
  rootUserPassword: ""
  existingSecret:
    name: ""
    emailKey: "root-user-email"
    passwordKey: "root-user-password"
    basicAuthKey: "basic-auth"
  persistence:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "20Gi"
    accessModes: []
    annotations: {}
    volumeName: ""

# --- ClickStack (ClickHouse + HyperDX all-in-one; observability backend) ---
clickstack:
  nodeAffinity: {}
  replicas: 1
  image: clickhouse/clickstack-all-in-one:latest
  otlpAuthToken: ""     # bearer token the collector uses to ingest (OTLP_AUTH_TOKEN)
  apiKey: ""            # HYPERDX_API_KEY
  appUrl: ""            # HYPERDX_APP_URL — external base URL for login/OAuth redirects (e.g. https://hyperdx.zako.ac); empty = image default (localhost)
  existingSecret:
    name: ""
    otlpTokenKey: "otlp-auth-token"
    apiKeyKey: "hyperdx-api-key"
  persistence:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "20Gi"
    accessModes: []
    annotations: {}
    volumeName: ""
