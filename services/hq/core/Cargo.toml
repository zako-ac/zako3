[package]
name = "hq-core"
version = "0.1.0"
edition = "2024"

[dependencies]
hq-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
async-trait.workspace = true
sqlx = { workspace = true }
uuid.workspace = true
chrono = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
mockall = { workspace = true }
urlencoding = "2.1.3"
sha2 = "0.10"
hex = "0.4.3"
jsonrpsee.workspace = true
zako3-states = { workspace = true, features = ["redis"] }
ae-protocol = { workspace = true }
rustc-hash = "2.1.2"
zako3-tts-matching.workspace = true
futures-util = "0.3.32"
zako3-metrics.workspace = true
async-nats = { workspace = true }
zako3-emoji-matcher-proto = { workspace = true }
zako3-cache-client.workspace = true
zakofish4-common.workspace = true
zako3-preload-cache.workspace = true
opentelemetry = "0.31"
tracing-opentelemetry = "0.32"

[dev-dependencies]
# The metrics test in `src/metrics.rs` drives a real Prometheus registry: the
# point is to prove the drop counter reaches `/metrics`, which a no-op meter
# cannot show. Versions match `zako3-telemetry`, the crate that installs the
# provider in production.
opentelemetry_sdk = "0.31"
opentelemetry-prometheus = "0.31"
prometheus = "0.14"
chrono.workspace = true
hex = "0.4.3"
sha2 = "0.10"
uuid.workspace = true
zakofish4-common.workspace = true
