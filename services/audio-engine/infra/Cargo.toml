[package]
name = "zako3-audio-engine-infra"
version = "0.1.0"
edition = "2024"

[dependencies]
zako3-taphub-transport-client.workspace = true
async-trait = "0.1.89"
dashmap = "6.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
songbird.workspace = true
zako3-audio-engine-audio.path = "../audio"
zako3-audio-engine-core.path = "../core"
zako3-types.workspace = true
opentelemetry = "0.31"
tracing-opentelemetry = "0.32"
redis = { version = "0.27", features = ["tokio-comp"] }
sha2 = "0.10"
zako3-cache-client.workspace = true
zako3-preload-cache.workspace = true
zako3-opus-jitter.workspace = true
zako3-states.workspace = true
protofish4.workspace = true
bytes = "1.12.1"
uuid.workspace = true
rand = "0.10.2"
jsonrpsee = { workspace = true, features = ["http-client"] }
anyhow.workspace = true

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
