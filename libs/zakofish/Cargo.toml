[package]
name = "zakofish"
version = "0.1.1"
edition = "2024"
authors = ["mincomk <mail@drchi.co.kr>"]
description = "Implementation of the Zakofish API, which is for communication between Zako3 infra and Tap"
license = "MIT"

[features]
# Record the request-path counters into the global OpenTelemetry meter provider
# (see `zako3_telemetry::init_metrics`) in addition to the atomics `/health`
# reads. Off by default, so a tap that only wants liveness pays nothing for it.
metrics = ["dep:opentelemetry"]

[dependencies]
async-trait.workspace = true
bytes = "1.11.1"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
opentelemetry = { version = "0.31", optional = true }
protofish3.workspace = true
rmp-serde = "1.3.1"
rustls = "0.23.37"
rustls-pemfile = "2.2.0"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing.workspace = true

[dev-dependencies]
rcgen = "0.14.7"
rustls = { version = "0.23.37", features = ["ring"] }
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
