[package]
name    = "zako3-tap-sdk"
version = "0.2.0"
edition = "2024"
authors = ["mincomk <mail@drchi.co.kr>"]
description = "High-level SDK for Tap, built on top of Zakofish"
license = "MIT"

[features]
auto-encode = ["dep:ogg", "dep:tokio-stream"]
healthcheck = ["dep:axum"]
# Request-path counters on the tap's `/metrics`, recorded through the same
# OpenTelemetry exporter every other zako3 service uses.
metrics = ["zakofish/metrics", "dep:zako3-telemetry", "dep:prometheus"]

[dependencies]
zakofish = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
bytes        = "1"
tracing      = { workspace = true }
thiserror    = { workspace = true }
rustls       = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

ogg          = { version = "0.9", features = ["async"], optional = true }
tokio-stream = { version = "0.1", optional = true }
axum         = { workspace = true, optional = true }
zako3-telemetry = { workspace = true, optional = true }
prometheus   = { version = "0.14", optional = true }
rustls-native-certs = "0.8.3"
protofish3.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
